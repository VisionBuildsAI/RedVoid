<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RedVoid | Cyber Warfare Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');
      
      :root {
        --color-bg: #05070B;
        --color-red: #FF003C;
        --color-blue: #00F0FF;
        --color-orange: #FF9F00;
        --color-text: #E5E7EB;
        --color-gray: #6B7280;
      }

      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        overflow-x: hidden;
      }

      h1, h2, h3, h4, .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }

      .font-mono, .log-text {
        font-family: 'Share Tech Mono', monospace;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #222; 
        border: 1px solid #333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-red); 
      }

      /* CRT / Scanline Effects */
      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
      
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 0, 0, 0.1) 50%, rgba(0,0,0,0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 8s linear infinite;
        pointer-events: none;
      }
      
      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      .glass-panel {
        background: rgba(5, 7, 11, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }

      .neon-text-red {
        text-shadow: 0 0 5px rgba(255, 0, 60, 0.5), 0 0 10px rgba(255, 0, 60, 0.3);
      }
      
      .neon-border-red {
        box-shadow: 0 0 5px rgba(255, 0, 60, 0.5), inset 0 0 10px rgba(255, 0, 60, 0.1);
        border-color: rgba(255, 0, 60, 0.5);
      }

      .grid-bg {
        background-size: 30px 30px;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      }

      .animate-pulse-fast {
        animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  <script type="importmap">
{
  "imports": {

}
</script>
</head>

  </body>
</html>
